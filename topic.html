<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">

    <style>
      body { 
        padding: 24px; 
        max-width: 1200px; 
        margin: 0 auto; 
      }
      .topic-title { 
        font-size: 24px; 
        text-decoration: underline; 
        text-underline-offset: 4px; 
        margin-bottom: 20px;
        display: none; /* Hide title by default */
      }
      .back { 
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px; 
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content { 
        font-size: 14px; 
        color: var(--fg); 
        line-height: 1.6;
      }
      
      /* Video container */
      :root {
        --video-width: 720px;
        --video-height: 405px;
      }
      
      .video-container {
        display: flex;
        justify-content: center;
        margin: 20px 0;
        pointer-events: none;
      }
      
      .video-container iframe {
        width: var(--video-width);
        height: var(--video-height);
        max-width: 100%;
        border-radius: 8px;
        pointer-events: auto !important;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      
      /* Vimeo video styling */
      .video-container iframe[src*="vimeo.com"] {
        width: var(--video-width);
        height: var(--video-height);
      }
      
      @media (max-width: 768px) {
        .video-container iframe {
          width: 100%;
          height: auto;
          aspect-ratio: 16 / 9;
        }
      }
      
      .video-container media-item {
        width: 100%;
        max-width: 800px;
        height: auto;
      }
      
      /* Project grid */
      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .project-card {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 16px;
        background: #fafafa;
      }
      
      .project-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      
      .project-description {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      
      .project-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
      }
      
      .project-link:hover {
        text-decoration: underline;
      }
      
      /* Grid style (for backwards compatibility) */
      .image-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .image-item {
        text-align: center;
      }
      
      .image-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      
      .image-item p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
    </style>
</head>

      // ============================================
      // PAGE INITIALIZATION
      // ============================================
      
      (function(){
        const params = new URLSearchParams(location.search);
        const topic = (params.get('t') || '').trim();
        const year = (params.get('y') || '').trim();
        const title = document.getElementById('title');
        const content = document.getElementById('content');
        
        if (!topic) {
          title.style.display = 'none';
          content.textContent = 'No topic specified.';
          return;
        }
        
        // Create unique key for year-topic combination
        const uniqueKey = year ? `${year}-${topic}` : topic;
        
        // Get topic data or use default
        let topicData = topicContent[uniqueKey];
        if (!topicData) {
          topicData = topicContent[topic];
        }
        if (!topicData) {
          topicData = {
            title: year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1),
            content: `<p>This is a placeholder page for "${topic}"${year ? ` from ${year}` : ''}. Add your projects, text, and media here.</p>`
          };
        }
        
        // Set title - use topicData.title if available, otherwise generate one
        const pageTitle = topicData.title || (year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1));
        // Hide the title element
        title.style.display = 'none';
        
        // Get content - if it's a function, call it; otherwise use it directly
        let contentHTML = topicData.content;
        if (typeof contentHTML === 'function') {
          contentHTML = contentHTML();
        }
        // Treat "None" string as empty content
        if (contentHTML === 'None' || contentHTML === 'none') {
          contentHTML = `<p>Content for "${pageTitle}" is coming soon.</p>`;
        }
        content.innerHTML = contentHTML || '<p>No content available.</p>';
        document.title = `${pageTitle} — Portfolio`;
        
        // Initialize image displays after content is loaded
        // Use multiple attempts to ensure galleries/videos are initialized
        const initDisplays = () => {
          if (typeof initImageDisplays === 'function') {
            // Wait a bit for DOM to update after innerHTML
            setTimeout(() => {
              initImageDisplays();
            }, 10);
          } else {
            console.warn('initImageDisplays function not available yet, retrying...');
            setTimeout(initDisplays, 100);
          }
        };
        
        // Apply video styling to make all videos look like images
        if (typeof applyVideoImageStyle === 'function' && !window.videoImageStyleApplied) {
          applyVideoImageStyle();
          window.videoImageStyleApplied = true;
        }
        
        // Load video APIs
        if (typeof loadYouTubeAPI === 'function') loadYouTubeAPI();
        if (typeof loadVimeoAPI === 'function') loadVimeoAPI();

            // Re-initialize after APIs load

            setTimeout(initVideoControls, 2000);
