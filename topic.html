    <style>
      body { 
        padding: 24px; 
        max-width: 1200px; 
        margin: 0 auto; 
      }
      .topic-title { 
        font-size: 24px; 
        text-decoration: underline; 
        text-underline-offset: 4px; 
        margin-bottom: 20px;
        display: none; /* Hide title by default */
      }
      .back { 
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px; 
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content { 
        font-size: 14px; 
        color: var(--fg); 
        line-height: 1.6;
      }
      
      /* Video container */
      :root {
        --video-width: 720px;
        --video-height: 405px;
      }
      
      .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 40px auto 80px auto;
        width: 70%;
        max-width: 70vw;
        pointer-events: none;
        position: relative;
      }
      
      .video-container iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        border-radius: 0;
        pointer-events: auto !important;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }
      
      /* Vimeo video styling */
      .video-container iframe[src*="vimeo.com"] {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        display: block;
        margin: 0 auto;
      }
      
      @media (max-width: 768px) {
        .video-container {
          width: 70%;
          max-width: 70vw;
        }
        .video-container iframe {
          width: 100%;
          height: auto;
          aspect-ratio: 16 / 9;
          display: block;
          margin: 0 auto;
        }
      }
      
      .video-container media-item {
        width: 100%;
        max-width: 800px;
        height: auto;
      }
      
      /* Project grid */
      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .project-card {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 16px;
        background: #fafafa;
      }
      
      .project-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      
      .project-description {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      
      .project-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
      }
      
      .project-link:hover {
        text-decoration: underline;
      }
      
      /* Grid style (for backwards compatibility) */
      .image-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .image-item {
        text-align: center;
      }
      
      .image-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      
      .image-item p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
    </style>
</head>

      function safeCreateImageDisplay(type, images, options) {
        if (typeof createImageDisplay === 'undefined') {
          console.error('createImageDisplay is not available');
          return '<p style="color: red;">Error: Image display function not loaded. Please refresh the page.</p>';
        }
        try {
          const result = createImageDisplay(type, images, options);
          if (!result || result.trim() === '') {
            console.warn('createImageDisplay returned empty result', { type, images, options });
            return '<p>No images to display.</p>';
          }
          return result;
        } catch (e) {
          console.error('Error calling createImageDisplay:', e);
          return '<p style="color: red;">Error creating image display. Check console for details.</p>';

      // ============================================
      // PAGE INITIALIZATION
      // ============================================
      
      (function(){
        const params = new URLSearchParams(location.search);
        const topic = (params.get('t') || '').trim();
        const year = (params.get('y') || '').trim();
        const title = document.getElementById('title');
        const content = document.getElementById('content');
        
        if (!topic) {
          title.style.display = 'none';
          content.textContent = 'No topic specified.';
          return;
        }
        
        // Create unique key for year-topic combination
        const uniqueKey = year ? `${year}-${topic}` : topic;
        
        // Get topic data or use default
        let topicData = topicContent[uniqueKey];
        if (!topicData) {
          topicData = topicContent[topic];
        }
        if (!topicData) {
          topicData = {
            title: year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1),
            content: `<p>This is a placeholder page for "${topic}"${year ? ` from ${year}` : ''}. Add your projects, text, and media here.</p>`
          };
        }
        
        // Set title - use topicData.title if available, otherwise generate one
        const pageTitle = topicData.title || (year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1));
        // Hide the title element
        title.style.display = 'none';
        
        // Get content - if it's a function, call it; otherwise use it directly
        let contentHTML = topicData.content;
        if (typeof contentHTML === 'function') {
          try {
            contentHTML = contentHTML();
          } catch (e) {
            console.error('Error executing content function:', e);
            contentHTML = '<p>Error loading content. Please refresh the page.</p>';
          }
        }
        // Treat "None" string as empty content
        if (contentHTML === 'None' || contentHTML === 'none') {
          contentHTML = `<p>Content for "${pageTitle}" is coming soon.</p>`;
        }
        // Check if contentHTML is empty or just whitespace
        if (!contentHTML || (typeof contentHTML === 'string' && !contentHTML.trim())) {
          // If we have a topic but no content, show a more helpful message
          if (topicData && topicData.content === undefined) {
            contentHTML = `<p>Content for "${pageTitle}" is coming soon.</p>`;
          } else {
            contentHTML = '<p>No content available. Please check the browser console for errors.</p>';
          }
        }
        // Debug logging
        console.log('Content HTML:', contentHTML ? contentHTML.substring(0, 100) : 'empty');
        console.log('Topic:', topic, 'Year:', year, 'Unique Key:', uniqueKey);
        
        content.innerHTML = contentHTML;
        document.title = `${pageTitle} — Portfolio`;
        
        // Add page title below the counter at the bottom
        let pageTitleElement = document.querySelector('.gallery-page-title');
        if (!pageTitleElement) {
          pageTitleElement = document.createElement('div');
          pageTitleElement.className = 'gallery-page-title';
          document.body.appendChild(pageTitleElement);
        }
        pageTitleElement.textContent = pageTitle;
        
        // Initialize image displays after content is loaded
        // Use multiple attempts to ensure galleries/videos are initialized
        const initDisplays = () => {
          if (typeof initImageDisplays === 'function') {
            // Wait a bit for DOM to update after innerHTML
            setTimeout(() => {
              initImageDisplays();
            }, 10);
          } else {
            console.warn('initImageDisplays function not available yet, retrying...');
            setTimeout(initDisplays, 100);
          }
        };
        
        // Apply video styling to make all videos look like images
        if (typeof applyVideoImageStyle === 'function' && !window.videoImageStyleApplied) {
          applyVideoImageStyle();
          window.videoImageStyleApplied = true;
        }
        
        // Load video APIs
        if (typeof loadYouTubeAPI === 'function') loadYouTubeAPI();
        if (typeof loadVimeoAPI === 'function') loadVimeoAPI();
        
        // Initialize video controls and players
        const initVideoControlsDelayed = () => {
          if (typeof initVideoControls === 'function') {
            initVideoControls();
            // Re-initialize after APIs load
            setTimeout(initVideoControls, 1000);
            setTimeout(initVideoControls, 2000);
          }
          // Also initialize Vimeo players after content is inserted
          if (typeof initVimeoPlayers === 'function') {
            setTimeout(() => {
              initVimeoPlayers();
            }, 500);
            setTimeout(() => {
              initVimeoPlayers();
            }, 1500);
            setTimeout(() => {
              initVimeoPlayers();
            }, 2500);
          }
          // Setup click handlers for pause/resume
          if (typeof setupVideoClickHandlers === 'function') {
            setTimeout(() => {
              setupVideoClickHandlers();
            }, 200);
            setTimeout(() => {
              setupVideoClickHandlers();
            }, 1200);
            setTimeout(() => {
              setupVideoClickHandlers();
            }, 2200);
          }
        };
        
        // Try immediately, then after a short delay, and again after content renders
        setTimeout(initDisplays, 50);
        setTimeout(initDisplays, 200);
        setTimeout(initDisplays, 500);
        
        // Initialize video controls
        setTimeout(initVideoControlsDelayed, 100);
        setTimeout(initVideoControlsDelayed, 500);
        setTimeout(initVideoControlsDelayed, 1000);
      })();
