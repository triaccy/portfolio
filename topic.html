<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/imageDisplay.css">
    <script src="js/videoControls.js?v=5"></script>
    <style>
      body {
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .back {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px;
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content {
        font-size: 14px;
        color: var(--fg);
        line-height: 1.6;
      }

      /* Video container */
      .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 40px auto 80px auto;
        width: 70%;
        max-width: 70vw;
        pointer-events: none;
        position: relative;
      }

      .video-container iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        border-radius: 0;
        pointer-events: auto !important;
        user-select: none;
        -webkit-user-select: none;
        object-fit: contain;
        display: block;
        margin: 0 auto;
      }

      .video-container iframe[src*="vimeo.com"] {
        aspect-ratio: 16 / 9;
      }

      @media (max-width: 768px) {
        .video-container {
          width: 70%;
          max-width: 70vw;
        }
        .video-container iframe {
          width: 100%;
          height: auto;
          aspect-ratio: 16 / 9;
          display: block;
          margin: 0 auto;
        }
      }
    </style>
</head>
<body>
    <a class="back" href="./">← back</a>
    <div class="content" id="content">Loading…</div>

    <script src="js/imageDisplay.js"></script>
    <script>
      // ============================================
      // TOPIC CONTENT CONFIGURATION
      // All keys are in year-topic (hyphen) format, lowercase.
      // ============================================

      function safeCreateImageDisplay(type, images, options) {
        if (typeof createImageDisplay === 'undefined') {
          console.error('createImageDisplay is not available');
          return '<p>Error: image display not loaded.</p>';
        }
        try {
          return createImageDisplay(type, images, options) || '<p>No images to display.</p>';
        } catch (e) {
          console.error('Error calling createImageDisplay:', e);
          return '<p>Error creating image display.</p>';
        }
      }

      function safeCreateVideoGallery(videos, options) {
        if (typeof createVideoGallery === 'undefined') {
          console.error('createVideoGallery is not available');
          return '<p>Error: video gallery not loaded.</p>';
        }
        try {
          return createVideoGallery(videos, options) || '<p>No videos to display.</p>';
        } catch (e) {
          console.error('Error calling createVideoGallery:', e);
          return '<p>Error creating video gallery.</p>';
        }
      }

      const topicContent = {

                      title="YouTube video player"
                      frameborder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                      allowfullscreen>
              </iframe>

        },

        '2025-food': {
          title: 'Food (2025)',
          content: `None`
        },

          title: '3DxPaper (2025)',

            { src: 'images/paper/before_screening.jpg', alt: 'Before Screening' },
            { src: 'images/paper/after_screening.jpg', alt: 'After Screening' },
            { src: 'images/paper/IMG_7181.jpg', alt: '3DxPaper Image 2' },
            { src: 'images/paper/IMG_6925 (1).jpg', alt: '3DxPaper Image 3' }

        '2024-food': {
          title: 'Food (2024)',

        },

        '2024-machine': {
          title: 'Knitting Machine (2024)',
          content: safeCreateImageDisplay('gallery', [

            { src: 'images/Knitted-Sandals.gif', alt: 'Knitted Sandals' },
            { src: 'images/Solid-Knitting-Machine-1.gif', alt: 'Solid Knitting Machine' }

        },

        '2024-biology/material': {
          title: 'biology/material (2024)',
          content: `<p>"Circwool" project: aims to develop innovative recycling technology for wool waste and reintegrate it into a circular textile cycle.
My work focused on pioneering the optimization of a green chemical extraction method for keratin from upcycled local wool and develop potential applications. Through this initial research phase, we successfully synthesized the first batch of working sizing, which was then applied to glass fibers for mechanical properties and wettability testing, including embedded fiber testing and pull-out tests. This foundational research lays the groundwork for creating a new, sustainable feedstock for industries like plastics (producing film through crosslinking keratin with enzymes) and fertilizers (soil enrichment through keratin degradation studies), moving beyond reliance on petroleum-based materials.
</p>`
        },

        '2024-chemistry/material': {
          title: 'chemistry/material (2024)',
          content: `None`
        },

        '2024-conservation': {

          content: safeCreateVideoGallery([
            {
              src: 'https://player.vimeo.com/video/1031316365?autoplay=1&loop=1&muted=1&controls=0&title=0&byline=0&portrait=0',

              allow: 'autoplay; fullscreen; picture-in-picture'
            },
            {
              src: 'https://player.vimeo.com/video/1017712698?autoplay=1&loop=1&muted=1&controls=0&title=0&byline=0&portrait=0',

            { src: 'images/archi2/architecture portfolio4.jpg', alt: 'Architecture Portfolio 4' },
            { src: 'images/archi2/architecture portfolio5.jpg', alt: 'Architecture Portfolio 5' },

            { src: 'images/archi2/architecture portfolio9.jpg', alt: 'Architecture Portfolio 9' }
          ], { id: 'ecosystem-2023-gallery' })

        '2022-architecture': {
          title: 'Architecture (2022)',
          content: safeCreateImageDisplay('gallery', [
            { src: 'images/archi 3/1.webp', alt: 'Architecture Portfolio Page 007' },
            { src: 'images/archi 3/2.webp', alt: 'Architecture Portfolio Page 008' }
          ], { id: 'architecture-2022-gallery' })

        '2022-chemistry': {
          title: 'Chemistry (2022)',
          content: `<p>Efficient energy storage systems and innovative material production processes are major challenges that require contributions from chemists towards achieving a sustainable society. The Noonan Lab works on the development of new conjugated materials and polymers that incorporate main group elements.
My work focuses on synthesising tunable systems for fluorescence and electronic applications.
</p>
<p>Great appreciation to my mentor Dhruv Sharma and the Noonan Lab!</p>`
        },

        '2021-installation': {
          title: 'Installation (2021)',
          content: `
            <div class="video-container">
              <iframe src="https://player.vimeo.com/video/1135686954?autoplay=1&loop=1&muted=1&controls=0&title=0&byline=0&portrait=0"
                      title="Vimeo video player"
                      frameborder="0"
                      allow="autoplay; fullscreen; picture-in-picture"
                      allowfullscreen>
              </iframe>
            </div>
          `
        },

        '2021-motion': {
          title: 'Motion (2021)',
          content: `None`
        }
      };

      // ============================================
      // PAGE INITIALIZATION
      // ============================================

      (function () {
        const params = new URLSearchParams(location.search);
        const topic = (params.get('t') || '').trim();
        const year  = (params.get('y') || '').trim();
        const content = document.getElementById('content');

        if (!topic) {
          content.textContent = 'No topic specified.';
          return;
        }

        // Key is always year-topic (hyphen), lowercase
        const key = year ? `${year}-${topic}` : topic;
        const topicData = topicContent[key] || {
          title: year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1),
          content: `<p>Content for "${topic}"${year ? ` from ${year}` : ''} is coming soon.</p>`
        };

        const pageTitle = topicData.title ||
          (year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1));

        let contentHTML = topicData.content;
        if (contentHTML === 'None' || contentHTML === 'none' || !contentHTML || !contentHTML.trim()) {
          contentHTML = `<p>Content for "${pageTitle}" is coming soon.</p>`;
        }

        content.innerHTML = contentHTML;
        document.title = `${pageTitle} — Portfolio`;

        // Page title at bottom
        let pageTitleEl = document.querySelector('.gallery-page-title');
        if (!pageTitleEl) {
          pageTitleEl = document.createElement('div');
          pageTitleEl.className = 'gallery-page-title';
          document.body.appendChild(pageTitleEl);
        }
        pageTitleEl.textContent = pageTitle;

        // Initialize image galleries (imageDisplay.js is sync-loaded above, DOM is ready)
        if (typeof initImageDisplays === 'function') initImageDisplays();

        // Initialize video controls
        if (typeof applyVideoImageStyle === 'function' && !window.videoImageStyleApplied) {
          applyVideoImageStyle();
          window.videoImageStyleApplied = true;
        }
        if (typeof loadYouTubeAPI === 'function') loadYouTubeAPI();
        if (typeof loadVimeoAPI === 'function') loadVimeoAPI();
        if (typeof initVideoControls === 'function') initVideoControls();
        // Vimeo/YouTube players need a short delay for iframe to render
        if (typeof initVimeoPlayers === 'function') setTimeout(initVimeoPlayers, 500);
        if (typeof setupVideoClickHandlers === 'function') setTimeout(setupVideoClickHandlers, 200);
      })();
    </script>
</body>
</html>
