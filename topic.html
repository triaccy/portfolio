<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/imageDisplay.css">
    <style>
      body { 
        padding: 24px; 
        max-width: 1200px; 
        margin: 0 auto; 
      }
      .topic-title { 
        font-size: 24px; 
        text-decoration: underline; 
        text-underline-offset: 4px; 
        margin-bottom: 20px;
        display: none; /* Hide title by default */
      }
      .back { 
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px; 
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content { 
        font-size: 14px; 
        color: var(--fg); 
        line-height: 1.6;
      }
      
      /* Video container */
      :root {
        --video-width: 720px;
        --video-height: 405px;
      }
      
      .video-container {
        display: flex;
        justify-content: center;
        margin: 20px 0;
      }
      
      .video-container iframe {
        width: var(--video-width);
        height: var(--video-height);
        border-radius: 8px;
      }
      
      .video-container media-item {
        width: 100%;
        max-width: 800px;
        height: auto;
      }
      
      /* Project grid */
      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .project-card {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 16px;
        background: #fafafa;
      }
      
      .project-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      
      .project-description {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      
      .project-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
      }
      
      .project-link:hover {
        text-decoration: underline;
      }
      
      /* Grid style (for backwards compatibility) */
      .image-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .image-item {
        text-align: center;
      }
      
      .image-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      
      .image-item p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
    </style>
</head>
<body>
    <a class="back" href="./">← back</a>
    <h1 class="topic-title" id="title">Topic</h1>
    <div class="content" id="content">Loading…</div>

    <script src="js/imageDisplay.js"></script>
    <script>
      // ============================================
      // TOPIC CONTENT CONFIGURATION
      // ============================================
      
      // Ensure imageDisplay functions are available
      if (typeof createImageDisplay === 'undefined') {
        console.error('imageDisplay.js failed to load');
        // Fallback function
        window.createImageDisplay = function() { return ''; };
      }
      
      const topicContent = {
        'interaction': {
          content: `
            <div class="video-container">
              <iframe src="https://www.youtube.com/embed/iZ_jGXTwNPw?autoplay=1&mute=1" 
                      title="YouTube video player" 
                      frameborder="0" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                      allowfullscreen>
              </iframe>
            </div>
          `
        },
        '2025-interaction': {
          content: `
            <div class="video-container">
              <iframe src="https://www.youtube.com/embed/iZ_jGXTwNPw?autoplay=1&mute=1" 
                      title="YouTube video player" 
                      frameborder="0" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                      allowfullscreen>
              </iframe>
            </div>
          `
        },
        'food': {
          content: `None`
        },
        '2025-food': {
          content: `None`
        },
        'conservation': {
          content: `None`
        },
        'chemistry': {
          content: `None`
        },
        'biology': {
          content: `None`
        },
        'graphics': {
          content: `None`
        },
        '2021-installation': {
          title: 'Installation (2021)',
          content: `
            <div class="video-container">
              <iframe src="https://youtu.be/FYSDYXtnJGo" 
                      title="YouTube video player" 
                      frameborder="0" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                      allowfullscreen>
              </iframe>
            </div>`
          `
        },
        '2023-installation': {
          title: 'Installation (2023)',
          content: createImageDisplay('gallery', [
            { src: 'images/installation-1.jpg', alt: 'Installation 1' },
            { src: 'images/installation-3.jpg', alt: 'Installation 3' }
          ], { id: 'installation-2023-gallery' })
        },
        'architecture': {
          content: `None`
        },
        'web': {
          content: `None`
        },
        'illustration': {
          content: `None`
        },
        'motion': {
          content: `None`
        },
        '3dxpaper': {
          title: '3DxPaper',
          content: createImageDisplay('gallery', [
            { src: 'images/paper/IMG_7059.jpg', alt: '3DxPaper Image 1' },
            { src: 'images/paper/before_screening.jpg', alt: 'Before Screening' },
            { src: 'images/paper/after_screening.jpg', alt: 'After Screening' },
            { src: 'images/paper/IMG_7181.jpg', alt: '3DxPaper Image 2' },
            { src: 'images/paper/IMG_6925 (1).jpg', alt: '3DxPaper Image 3' }
          ], { id: 'paper-gallery' })
        },
        '2025-3dxpaper': {
          title: '3DxPaper (2025)',
          content: createImageDisplay('gallery', [
            { src: 'images/paper/IMG_7059.jpg', alt: '3DxPaper Image 1' },
            { src: 'images/paper/before_screening.jpg', alt: 'Before Screening' },
            { src: 'images/paper/after_screening.jpg', alt: 'After Screening' },
            { src: 'images/paper/IMG_7181.jpg', alt: '3DxPaper Image 2' },
            { src: 'images/paper/IMG_6925 (1).jpg', alt: '3DxPaper Image 3' }
          ], { id: 'paper-gallery' })
        },
        '2024-machine': {
          content: `None`
        },
        '2024-biology': {
          content: `None`
        },
        '2024-graphics': {
          content: `None`
        },
        '2023-speculation': {
          title: 'Speculation (2023)',
          content: createImageDisplay('gallery', [
            { src: 'images/Sustainably-Honoring-Beached-Whales--2-dragged.png', alt: 'Sustainably Honoring Beached Whales 2' },
            { src: 'images/Sustainably-Honoring-Beached-Whales--3-dragged.png', alt: 'Sustainably Honoring Beached Whales 3' },
            { src: 'images/Sustainably-Honoring-Beached-Whales--4-dragged.png', alt: 'Sustainably Honoring Beached Whales 4' },
            { src: 'images/Sustainably-Honoring-Beached-Whales--5-dragged.png', alt: 'Sustainably Honoring Beached Whales 5' }
          ], { id: 'whale-gallery' })
        },
        '2024-conservation': {
          content: `None`
        },
        '2023-conservation': {
          content: `None`
        },
        '2024-chemistry': {
          content: `None`
        },
        '2022-chemistry': {
          content: `None`
        },
        '2022-architecture': {
          content: `None`
        },
        '2021-motion': {
          content: `None`
        }
      };

      // ============================================
      // PAGE INITIALIZATION
      // ============================================
      
      (function(){
        const params = new URLSearchParams(location.search);
        const topic = (params.get('t') || '').trim();
        const year = (params.get('y') || '').trim();
        const title = document.getElementById('title');
        const content = document.getElementById('content');
        
        if (!topic) {
          title.style.display = 'none';
          content.textContent = 'No topic specified.';
          return;
        }
        
        // Create unique key for year-topic combination
        const uniqueKey = year ? `${year}-${topic}` : topic;
        
        // Debug logging
        console.log('Topic:', topic, 'Year:', year, 'UniqueKey:', uniqueKey);
        console.log('Available keys:', Object.keys(topicContent));
        console.log('Looking for key:', uniqueKey, 'Found:', uniqueKey in topicContent);
        console.log('Fallback to topic:', topic, 'Found:', topic in topicContent);
        
        // Get topic data or use default
        let topicData = topicContent[uniqueKey];
        if (!topicData) {
          topicData = topicContent[topic];
        }
        if (!topicData) {
          topicData = {
            title: year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1),
            content: `<p>This is a placeholder page for "${topic}"${year ? ` from ${year}` : ''}. Add your projects, text, and media here.</p>`
          };
        }
        
        // Set title - use topicData.title if available, otherwise generate one
        const pageTitle = topicData.title || (year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1));
        // Hide the title element
        title.style.display = 'none';
        
        // Get content - if it's a function, call it; otherwise use it directly
        let contentHTML = topicData.content;
        if (typeof contentHTML === 'function') {
          contentHTML = contentHTML();
        }
        content.innerHTML = contentHTML || '<p>No content available.</p>';
        document.title = `${pageTitle} — Portfolio`;
        
        // Initialize image displays after content is loaded
        setTimeout(() => {
          if (typeof initImageDisplays === 'function') {
            initImageDisplays();
          } else {
            console.error('initImageDisplays function not available');
          }
        }, 100);
      })();
    </script>
</body>
</html>
