    <style>
      html, body {
        height: 100%;
      }
      body {
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      body.topic-no-scroll {
        overflow: hidden;
      }
      body.topic-no-scroll .content {
        height: 100%;
        overflow: hidden;
      }
      .back {
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px;
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content {
        font-size: 14px;
        color: var(--fg);
        line-height: 1.6;
      }
      body.topic-no-scroll .image-display.gallery,
      body.topic-no-scroll .image-display.vertical,
      body.topic-no-scroll .image-display.spread,
      body.topic-no-scroll .local-video-stack,
      body.topic-no-scroll .lv-gallery,
      body.topic-no-scroll .video-container {
        margin-top: 110px;
        margin-bottom: 150px;
      }
      body.topic-no-scroll .image-display.gallery .display-container,
      body.topic-no-scroll .local-video-stack .lv-wrap,
      body.topic-no-scroll .lv-gallery .lv-wrap,
      body.topic-no-scroll .video-container {
        height: calc(100vh - 260px);
        max-height: calc(100vh - 260px);
      }
      body.topic-no-scroll .image-display.gallery .display-image,
      body.topic-no-scroll .image-display.gallery .display-video,
      body.topic-no-scroll .local-video-stack .lv-wrap video,
      body.topic-no-scroll .lv-gallery .lv-wrap video,
      body.topic-no-scroll .lv-gallery .lv-wrap iframe,
      body.topic-no-scroll .video-container iframe {
        object-fit: contain;
      }

      /* Local self-hosted video stack (vertical) */
      .local-video-stack {
        display: flex;
        flex-direction: column;
        gap: 0;
        width: calc(100vw - 300px);
        max-width: calc(100vw - 300px);
        margin: 110px auto 150px auto;
      }
      .lv-wrap {
        position: relative;
        width: 100%;
        overflow: hidden;
      }
      .lv-wrap video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      /* Flip-through video gallery */
      .lv-gallery {
        width: calc(100vw - 300px);
        max-width: calc(100vw - 300px);
        margin: 110px auto 150px auto;
      }
      .lv-slide { display: none; }
      .lv-slide.lv-slide-active { display: block; }
      .lv-gallery { cursor: default; }
      .lv-gallery .lv-wrap { cursor: default; }
      .lv-gallery .lv-wrap.lv-portrait {
        height: calc(100vh - 260px);
        width: calc((100vh - 260px) * (240 / 332));
        margin: 0 auto;
      }
      .lv-gallery .lv-wrap:has(img) { cursor: ew-resize; }
      .lv-gallery.lv-video-active .lv-wrap::before,
      .lv-gallery.lv-video-active .lv-wrap::after {
        content: '';
        position: absolute;
        top: 0;
        width: 5px;
        height: 100%;
        cursor: ew-resize;
        z-index: 20;
      }
      .lv-gallery.lv-video-active .lv-wrap::before { left: 0; }
      .lv-gallery.lv-video-active .lv-wrap::after  { right: 0; }
      .lv-overlay-black .video-ctrl-left,
      .lv-overlay-black .play-pause-btn,
      .lv-overlay-black .fullscreen-btn,
      .lv-overlay-black .mute-btn,
      .lv-overlay-black .video-timestamp { color: #000 !important; }
      .lv-overlay-black .video-seek-track { background: rgba(0,0,0,0.25) !important; }
      .lv-overlay-black .video-seek-fill,
      .lv-overlay-black .video-seek-handle { background: #000 !important; }
      .lv-gallery-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        font-size: 12px;
      }
      .lv-gallery-counter {
        position: fixed;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        color: #999;
        font-size: 14px;
        pointer-events: none;
        z-index: 100;
      }
      .lv-prev, .lv-next {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 12px;
        color: var(--fg);
        padding: 0;
      }
      .lv-prev:hover, .lv-next:hover { opacity: 0.5; }
      .lv-gallery-counter .counter-current { color: #333; }

      /* Video container */
      .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 110px auto 150px auto;
        width: calc(100vw - 300px);
        max-width: calc(100vw - 300px);
        pointer-events: none;
        position: relative;
        overflow: hidden;
      }

      .video-container iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        border-radius: 0;
        pointer-events: auto !important;
        user-select: none;
        -webkit-user-select: none;
        display: block;
        margin: 0 auto;
        /* scale up slightly to clip any black edge artifacts from the player */
        transform: scale(1.004);
      }

      @media (max-width: 768px) {
        .video-container {
          width: calc(100vw - 300px);
          max-width: calc(100vw - 300px);
        }
      }

      // ============================================

      (function () {
        const params = new URLSearchParams(location.search);
        const topic = (params.get('t') || '').trim();
        const year  = (params.get('y') || '').trim();
        const content = document.getElementById('content');

        if (!topic) {
          content.textContent = 'No topic specified.';
          return;
        }

        // Key is always year-topic (hyphen), lowercase
        const key = year ? `${year}-${topic}` : topic;
        const isBiologyMaterialTopic = key === '2024-biology/material';
        document.body.classList.toggle('topic-no-scroll', !isBiologyMaterialTopic);
        const topicData = topicContent[key] || {
          title: year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1),
          content: `<p>Content for "${topic}"${year ? ` from ${year}` : ''} is coming soon.</p>`
        };

        const pageTitle = topicData.title ||
          (year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1));

        let contentHTML = topicData.content;
        if (contentHTML === 'None' || contentHTML === 'none' || !contentHTML || !contentHTML.trim()) {
          contentHTML = `<p>Content for "${pageTitle}" is coming soon.</p>`;
        }

        content.innerHTML = contentHTML;
        document.title = `${pageTitle} — Portfolio`;

        // Page title at bottom
        let pageTitleEl = document.querySelector('.gallery-page-title');
        if (!pageTitleEl) {
          pageTitleEl = document.createElement('div');
          pageTitleEl.className = 'gallery-page-title';
          document.body.appendChild(pageTitleEl);
        }
        pageTitleEl.textContent = pageTitle;

        // Initialize image galleries (imageDisplay.js is sync-loaded above, DOM is ready)
        if (typeof initImageDisplays === 'function') initImageDisplays();

        // Initialize video controls
        if (typeof applyVideoImageStyle === 'function' && !window.videoImageStyleApplied) {
          applyVideoImageStyle();
          window.videoImageStyleApplied = true;
        }
        if (typeof loadYouTubeAPI === 'function') loadYouTubeAPI();
        if (typeof loadVimeoAPI === 'function') loadVimeoAPI();
        if (typeof initVideoControls === 'function') initVideoControls();
        // Vimeo/YouTube players need a short delay for iframe to render
        if (typeof initVimeoPlayers === 'function') setTimeout(initVimeoPlayers, 500);

        // Flip-through video gallery (conservation 2024)
        document.querySelectorAll('.lv-gallery').forEach(gallery => {
          const slides = Array.from(gallery.querySelectorAll('.lv-slide'));
          const counter = gallery.querySelector('.lv-gallery-counter');
          let current = 0;

          function vimeoPlayerForSlide(slide) {
            const iframe = slide.querySelector('iframe');
            if (!iframe) return null;
            const vid = iframe.src.match(/vimeo\.com\/video\/(\d+)/)?.[1];
            return vid ? window.vimeoPlayers?.[vid] : null;
          }

          function pauseSlide(slide) {
            slide.querySelector('video')?.pause();
            vimeoPlayerForSlide(slide)?.pause().catch(() => {});
          }

          function playSlide(slide) {
            const video = slide.querySelector('video');
            if (video) {
              video.play().catch(() => {});
              // sync overlay button
              const btn = slide.querySelector('.play-pause-btn');
              const ovl = slide.querySelector('.video-controls-overlay');
              if (btn) btn.textContent = 'Pause';
              if (ovl) ovl.dataset.playing = 'true';
            }
            vimeoPlayerForSlide(slide)?.play().catch(() => {});
          }

          function fetchVimeoRatio(vid, wrap) {
            fetch('https://vimeo.com/api/oembed.json?url=https://vimeo.com/' + vid)
              .then(r => r.json())
              .then(data => { if (data.width && data.height) wrap.style.aspectRatio = data.width + ' / ' + data.height; })
              .catch(() => {});
          }

          function loadVimeoSlide(slide, thenPlay) {
            const wrap = slide.querySelector('.lv-wrap');
            if (wrap.querySelector('iframe')) {
              if (thenPlay) playSlide(slide);
              return;
            }
            const iframe = document.createElement('iframe');
            iframe.src = slide.dataset.vimeoSrc;
            iframe.frameBorder = '0';
            iframe.allow = 'autoplay; fullscreen; picture-in-picture';
            iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
            wrap.appendChild(iframe);
            if (typeof loadVimeoAPI === 'function') loadVimeoAPI();
            setTimeout(() => {
              if (typeof initSingleVideoControls === 'function') initSingleVideoControls(iframe);
              if (thenPlay) playSlide(slide);
            }, 400);
          }

          function goTo(index) {
            pauseSlide(slides[current]);
            slides[current].classList.remove('lv-slide-active');
            current = (index + slides.length) % slides.length;
            slides[current].classList.add('lv-slide-active');
            if (counter) counter.innerHTML = '<span class="counter-current">' + (current + 1) + '</span> / ' + slides.length;
            gallery.classList.toggle('lv-video-active', !slides[current].querySelector('img'));
            if (slides[current].dataset.vimeoSrc) {
              loadVimeoSlide(slides[current], true);
            } else {
              playSlide(slides[current]);
            }
          }

          gallery.querySelector('.lv-prev')?.addEventListener('click', () => goTo(current - 1));
          gallery.querySelector('.lv-next')?.addEventListener('click', () => goTo(current + 1));

          // Click-to-navigate: image slides use full-area; video slides use 5px edge strips at lv-wrap edges
          gallery.addEventListener('click', (e) => {
            if (e.target.closest('.lv-prev, .lv-next')) return;
            const activeWrap = slides[current].querySelector('.lv-wrap');
            const ref = activeWrap ? activeWrap.getBoundingClientRect() : gallery.getBoundingClientRect();
            const clickX = e.clientX - ref.left;
            if (slides[current].querySelector('img')) {
              if (e.clientX >= ref.left && e.clientX <= ref.right) {
                e.stopPropagation();
                goTo(clickX < ref.width / 2 ? current - 1 : current + 1);
              }
            } else {
              if (clickX < 5) { e.stopPropagation(); goTo(current - 1); }
              else if (clickX > ref.width - 5) { e.stopPropagation(); goTo(current + 1); }
            }
          }, true);

          // Keyboard navigation (ArrowLeft/ArrowRight)
          document.addEventListener('keydown', (e) => {
            if (!document.body.contains(gallery)) return;
            const rect = gallery.getBoundingClientRect();
            if (rect.top >= window.innerHeight || rect.bottom <= 0) return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
          });

          // Pre-fetch Vimeo aspect ratios for all slides via oEmbed API
          slides.forEach(slide => {
            const vid = (slide.dataset.vimeoSrc || '').match(/vimeo\.com\/video\/(\d+)/)?.[1];
            if (vid) fetchVimeoRatio(vid, slide.querySelector('.lv-wrap'));
          });

          // Set initial cursor class and load first slide
          gallery.classList.toggle('lv-video-active', !slides[0].querySelector('img'));
          if (slides[0].dataset.vimeoSrc) {
            loadVimeoSlide(slides[0], true);
          } else {
            playSlide(slides[0]);
          }
        });

        // Native video controls — same overlay style as YouTube/Vimeo
        function fmtNative(s) {
          s = Math.floor(s || 0);
          const m = Math.floor(s / 60), sec = s % 60;
          return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
        }
        document.querySelectorAll('.lv-wrap').forEach((wrap, i) => {
          const video = wrap.querySelector('video');
          if (!video) return;
          const uid = 'lv-' + i;
          wrap.insertAdjacentHTML('beforeend', `
            <div class="video-controls-overlay" data-playing="true" data-muted="true">
              <div class="video-click-overlay"></div>
              <div class="video-bottom-bar">
                <div class="video-ctrl-left">
                  <button class="play-pause-btn">Pause</button>
                  <button class="fullscreen-btn">Fullscreen</button>
                  <button class="mute-btn">Unmute</button>
                  <span class="video-timestamp">00:00 / 00:00</span>
                </div>
                <div class="video-seek-area">
                  <div class="video-seek-track">
                    <div class="video-seek-fill"></div>
                    <div class="video-seek-handle"></div>
                  </div>
                </div>
              </div>
            </div>
          `);
          const overlay   = wrap.querySelector('.video-controls-overlay');
          const playBtn   = overlay.querySelector('.play-pause-btn');
          const muteBtn   = overlay.querySelector('.mute-btn');
          const fsBtn     = overlay.querySelector('.fullscreen-btn');
          const ts        = overlay.querySelector('.video-timestamp');
          const track     = overlay.querySelector('.video-seek-track');
          const fill      = overlay.querySelector('.video-seek-fill');
          const handle    = overlay.querySelector('.video-seek-handle');
          const clickOvl  = overlay.querySelector('.video-click-overlay');

          const updateUI = () => {
            const dur = video.duration || 0, cur = video.currentTime || 0;
            const pct = dur ? (cur / dur * 100) : 0;
            fill.style.width  = pct + '%';
            handle.style.left = pct + '%';
            ts.textContent = fmtNative(cur) + ' / ' + fmtNative(dur);
          };
          video.addEventListener('timeupdate', updateUI);
          video.addEventListener('loadedmetadata', () => {
            if (video.videoWidth && video.videoHeight) {
              wrap.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
            }
            updateUI();
          });
          video.play().catch(() => {});

          playBtn.addEventListener('click', e => {
            e.stopPropagation();
            if (video.paused) { video.play(); playBtn.textContent = 'Pause'; overlay.dataset.playing = 'true'; }
            else              { video.pause(); playBtn.textContent = 'Play';  overlay.dataset.playing = 'false'; }
          });
          clickOvl.addEventListener('click', e => { e.stopPropagation(); playBtn.click(); });

          muteBtn.addEventListener('click', e => {
            e.stopPropagation();
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
            overlay.dataset.muted = String(video.muted);
          });

          fsBtn.addEventListener('click', e => {
            e.stopPropagation();
            document.fullscreenElement ? document.exitFullscreen() : wrap.requestFullscreen?.();
          });

          let dragging = false;
          const seekTo = (clientX) => {
            const rect = track.getBoundingClientRect();
            const pct  = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            video.currentTime = (video.duration || 0) * pct;
          };
          track.addEventListener('mousedown', e => { e.stopPropagation(); e.preventDefault(); dragging = true; seekTo(e.clientX); });
          document.addEventListener('mousemove', e => { if (dragging) seekTo(e.clientX); });
          document.addEventListener('mouseup', () => { dragging = false; });
        });
      })();
    </script>
</body>
</html>
