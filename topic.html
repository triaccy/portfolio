<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      body { 
        padding: 24px; 
        max-width: 1200px; 
        margin: 0 auto; 
      }
      .topic-title { 
        font-size: 24px; 
        text-decoration: underline; 
        text-underline-offset: 4px; 
        margin-bottom: 20px;
      }
      .back { 
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px; 
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content { 
        font-size: 14px; 
        color: var(--fg); 
        line-height: 1.6;
      }
      
      /* Video sizing - adjust these variables to change size */
      :root {
        --video-width: 720px;
        --video-height: 405px;
      }
      
      .video-container {
        display: flex;
        justify-content: center;
        margin: 20px 0;
      }
      
      .video-container iframe {
        width: var(--video-width);
        height: var(--video-height);
        border-radius: 8px;
      }
      
      .project-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .project-card {
        border: 1px solid #eee;
        border-radius: 8px;
        padding: 16px;
        background: #fafafa;
      }
      
      .project-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      
      .project-description {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 12px;
      }
      
      .project-link {
        font-size: 12px;
        color: var(--accent);
        text-decoration: none;
      }
      
      .project-link:hover {
        text-decoration: underline;
      }
      
      .image-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      
      .image-item {
        text-align: center;
      }
      
      .image-item img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      
      .image-item p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
    </style>
</head>
<body>
    <a class="back" href="./">← back</a>
    <h1 class="topic-title" id="title">Topic</h1>
    <div class="content" id="content">Loading…</div>

    <script>
      // Topic content configuration
      const topicContent = {
        'interaction': {
        
          content: `
            <div class="video-container">
              <iframe src="https://www.youtube.com/embed/iZ_jGXTwNPw?autoplay=1&mute=1" 
                      title="YouTube video player" 
                      frameborder="0" 
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                      allowfullscreen>
              </iframe>
            </div>
            
          `
        },
        'events': {
          content: `
          None  
          `
        },
        'machine': {
          content: `None`
        },
        'conservation': {
          content: `None`
        },
        'chemistry': {
          content: `None`
        },
        'biology': {
          content: `None`
        },
        'graphics': {
          content: `None`
        },
        'installation': {
          content: `
            None
          `
        },
        'architecture': {
          
          content: `
            None
          `
        },
        'web': {

          content: `
            None
          `
        },
        'illustration': {
          content: `
            None
          `
        },
        'motion': {
          content: `
            None
          `
        },
        '2024-machine': {
          content: `
            None
          `
        },
        '2023-machine': {
          content: `
            None
          `
        },
        '2024-conservation': {
          content: `
            None
          `
        },
        '2023-conservation': {
          content: `
            None
          `
        },
        '2024-chemistry': {
          content: `
            None
          `
        },
        '2022-chemistry': {
          content: `
            None
          `
        }
      };

      // Initialize page
      (function(){
        const params = new URLSearchParams(location.search);
        const topic = (params.get('t') || '').trim();
        const year = (params.get('y') || '').trim();
        const title = document.getElementById('title');
        const content = document.getElementById('content');
        
        if (!topic) {
          title.textContent = 'Unknown Topic';
          content.textContent = 'No topic specified.';
          return;
        }
        
        // Create unique key for year-topic combination
        const uniqueKey = year ? `${year}-${topic}` : topic;
        
        // Get topic data or use default
        const topicData = topicContent[uniqueKey] || topicContent[topic] || {
          title: year ? `${topic} (${year})` : topic.charAt(0).toUpperCase() + topic.slice(1),
          content: `<p>This is a placeholder page for "${topic}"${year ? ` from ${year}` : ''}. Add your projects, text, and media here.</p>`
        };
        
        title.textContent = topicData.title;
        content.innerHTML = topicData.content;
        document.title = `${topicData.title} — Portfolio`;
      })();
    </script>
</body>
</html>
