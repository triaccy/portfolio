<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation 2023</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../css/imageDisplay.css">
    <style>
      body { 
        padding: 24px; 
        max-width: 1200px; 
        margin: 0 auto; 
      }
      .back { 
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 1000;
        font-size: 12px; 
        color: var(--fg);
        text-decoration: underline;
        text-underline-offset: 3px;
        opacity: 0.85;
      }
      .back:hover {
        opacity: 0.7;
      }
      .content { 
        font-size: 14px; 
        color: var(--fg); 
        line-height: 1.6;
      }
    </style>
</head>
<body>
    <a class="back" href="../../">← back</a>
    
    <div class="content">
      <div id="installation-gallery"></div>
    </div>
    
    <script src="../../js/imageDisplay.js"></script>
    <script>
      // Wait for DOM and script to be ready
      document.addEventListener('DOMContentLoaded', function() {
        // Check if imageDisplay functions are available
        if (typeof createImageDisplay === 'undefined') {
          console.error('imageDisplay.js not loaded');
          document.getElementById('installation-gallery').innerHTML = '<p>Error loading gallery. Please refresh the page.</p>';
          return;
        }
        
        // Create gallery using the modular imageDisplay.js
        const galleryHTML = createImageDisplay('gallery', [
          { src: '../../images/installation-1.jpg', alt: 'Installation 1' },
          { src: '../../images/installation-3.jpg', alt: 'Installation 3' }
        ], { id: 'installation-2023-gallery' });
        
        if (galleryHTML) {
          document.getElementById('installation-gallery').innerHTML = galleryHTML;
          
          // Set page title for bottom bar
          const pageTitle = 'Installation (2023)';
          window.currentPageTitle = pageTitle;
          const galleries = document.querySelectorAll('.image-display.gallery');
          galleries.forEach(gallery => {
            gallery.dataset.pageTitle = pageTitle;
          });
          
          // Initialize the gallery after images have a chance to load
          setTimeout(() => {
            if (typeof initImageDisplays === 'function') {
              initImageDisplays();
            }
          }, 200);
        }
      });
    </script>
</body>
</html>
